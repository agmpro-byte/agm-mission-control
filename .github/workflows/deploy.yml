name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Scheduled heal pass: 2026-07-05 a 3-attempt failure landed on the LAST push
  # of the day, so "self-heals on the next content push" never came and the site
  # sat stale ~2h until Troy saw GitHub's failure email. The heal job re-runs a
  # failed latest deploy so staleness is bounded at ~2h with no human in the loop.
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pure static publish (2026-07-21 retooling): the Next.js app is gone;
      # public/ IS the site. No node, no npm ci, no build — one less failure
      # surface for the flaky-Pages-backend windows documented below.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pages backend intermittently returns "Deployment failed, try again later"
      # with githubstatus.com green. Observed windows can outlast a single 60s
      # backoff (2026-07-03: 07:13 + two manual re-runs at 07:14/07:22 all failed;
      # 4 more on 07-02). Three attempts with growing backoff (60s, then 4 min)
      # ride out short windows; only a ~6-min-sustained outage fails the run and
      # emails the org owner. Longer windows self-heal on the next content push
      # (~15-min True North render cadence).
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deployment.outcome == 'failure'
        run: sleep 60
      - id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deployment.outcome == 'failure' && steps.deployment-retry.outcome == 'failure'
        run: sleep 240
      - id: deployment-retry-2
        if: steps.deployment.outcome == 'failure' && steps.deployment-retry.outcome == 'failure'
        uses: actions/deploy-pages@v4
      # All 3 attempts exhausted → say so where we watch (Slack), not just the
      # org-owner email. No-ops until the SLACK_WEBHOOK_URL secret is set.
      - if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then echo "SLACK_WEBHOOK_URL secret not set — skipping alert"; exit 0; fi
          curl -s -X POST -H 'Content-type: application/json' --data \
            "{\"text\":\"🔴 *True North Pages deploy FAILED* (all 3 attempts, commit ${GITHUB_SHA:0:7}) — agmmissioncontrol.com is serving the PREVIOUS render. Auto-heal re-runs it within 2h; manual: re-run failed jobs at $RUN_URL\"}" \
            "$SLACK_WEBHOOK_URL"

  # Every 2h: if the most recent push-triggered run failed, re-run its failed
  # jobs. Bounds site staleness when a Pages flake eats the day's last push.
  heal:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(gh api "repos/${{ github.repository }}/actions/workflows/deploy.yml/runs?branch=main&event=push&per_page=1" --jq '.workflow_runs[0]')
          id=$(echo "$run" | jq -r .id)
          conclusion=$(echo "$run" | jq -r .conclusion)
          echo "Latest push run: $id concluded: $conclusion"
          if [ "$conclusion" = "failure" ]; then
            echo "Re-running failed jobs on $id"
            gh api -X POST "repos/${{ github.repository }}/actions/runs/$id/rerun-failed-jobs"
          fi
